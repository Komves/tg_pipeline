name: GPT repeat setup checks
on:
  push:
    paths:
      - 'bot/vesya_tools/gpt/handler.py'
      - 'tests/test_gpt_active_repeat.py'
      - 'tests/test_gpt_credential_vault.py'
      - '.github/workflows/gpt-active-repeat.yml'
  pull_request:
    paths:
      - 'bot/vesya_tools/gpt/handler.py'
      - 'tests/test_gpt_active_repeat.py'
      - '.github/workflows/gpt-active-repeat.yml'

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install 'aiogram==3.24.0' 'httpx>=0.27' 'cryptography>=43,<47'
      - name: Syntax check
        run: python -m py_compile bot/vesya_tools/gpt/handler.py bot/vesya_tools/gpt/credential_vault.py bot/vesya_tools/gpt/registry.py tests/test_gpt_active_repeat.py tests/test_gpt_credential_vault.py
      - name: Check active GPT repeat setup and safety
        run: |
          python -m unittest discover -s tests -p 'test_gpt_active_repeat.py' -v
          python -m unittest discover -s tests -p 'test_gpt_credential_vault.py' -v
