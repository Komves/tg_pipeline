name: GPT onboarding isolated checks

on:
  push:
    branches:
      - feature/gpt-proxy-agent-isolated
  pull_request:
    paths:
      - 'bot/vesya_tools/gpt/**'
      - 'ops/gpt_*.py'
      - 'tests/test_gpt*.py'
      - 'bot/main.py'

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'aiogram==3.24.0' 'httpx>=0.27'
          sudo apt-get update -qq
          sudo apt-get install -y -qq apache2-utils
      - name: Parse all changed Python modules
        run: |
          python -m py_compile bot/main.py bot/vesya_tools/gpt/*.py ops/gpt_proxy_agent.py ops/gpt_apply_projection.py
      - name: Run offline GPT-only tests
        run: |
          python -m unittest discover -s tests -p 'test_gpt*.py' -v
