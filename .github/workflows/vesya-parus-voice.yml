name: Vesya PARUS voiceover checks

on:
  pull_request:
    paths:
      - 'bot/main.py'
      - 'bot/vesya_tools/parus_voiceover.py'
      - 'bot/tests/test_parus_voiceover.py'
      - '.github/workflows/vesya-parus-voice.yml'
  push:
    branches: [master]
    paths:
      - 'bot/main.py'
      - 'bot/vesya_tools/parus_voiceover.py'
      - 'bot/tests/test_parus_voiceover.py'
      - '.github/workflows/vesya-parus-voice.yml'
  workflow_dispatch:

jobs:
  syntax-and-offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install httpx
      - name: Compile voice integration
        run: python -m py_compile bot/main.py bot/vesya_tools/parus_voiceover.py bot/tests/test_parus_voiceover.py
      - name: Run offline sample tests
        run: python -m unittest discover -s bot/tests -p test_parus_voiceover.py -v
