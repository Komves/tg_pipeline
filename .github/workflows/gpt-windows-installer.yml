name: GPT Windows installer release checks

on:
  push:
    branches:
      - master
      - fix/gpt-upgrade-close-running-20261118
    paths:
      - 'ops/gpt_windows_client/**'
      - '.github/workflows/gpt-windows-installer.yml'
  pull_request:
    paths:
      - 'ops/gpt_windows_client/**'
      - '.github/workflows/gpt-windows-installer.yml'
  workflow_dispatch:

# Publish only on master after Defender scans and install/uninstall checks.
# Render environment configuration is updated separately.
permissions:
  contents: write

jobs:
  windows-security-review:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ops/gpt_windows_client/go.mod

      - name: Check no self-copy or hidden command execution
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = (Get-Content ops/gpt_windows_client/main.go -Raw) + (Get-Content ops/gpt_windows_client/account_windows.go -Raw)
          foreach ($pattern in @('powershell[.]exe','installToLocalAppData','os[.]Executable[(]','CreateShortcut[(]','exec[.]Command[(]installed')) {
            if ($src -match $pattern) { throw "Legacy installer behavior still present: $pattern" }
          }
          if ($src -notmatch '--disable-http2') { throw 'Required Chrome flag missing' }
          if ($src -notmatch '127[.]0[.]0[.]1:43139') { throw 'Local proxy endpoint changed' }

      - name: Compile the GPT launcher natively on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location ops/gpt_windows_client
          gofmt -w main.go account_windows.go
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw 'go vet failed' }
          New-Item -ItemType Directory -Force dist | Out-Null
          $env:CGO_ENABLED = '0'
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          go build -trimpath -ldflags '-H windowsgui' -o dist/GPT.exe .
          if ($LASTEXITCODE -ne 0 -or !(Test-Path dist/GPT.exe)) { throw 'Windows Go build failed' }
          Pop-Location

      - name: Install Inno Setup compiler
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $paths = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          if (-not ($paths | Where-Object { Test-Path $_ })) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup install failed' }
          }

      - name: Generate genuine Windows ICO from approved GPT artwork
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install 'Pillow>=11,<13'
          python ops/gpt_windows_client/build_icon.py
          if ($LASTEXITCODE -ne 0) { throw 'GPT ICO generation or validation failed' }
          $path = (Resolve-Path ops/gpt_windows_client/GPT-v1.1.2.ico).Path
          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Icon]::new($path)
          try {
            if ($icon.Width -lt 16) { throw 'Native Windows API rejected GPT ICO' }
            Write-Host "Native Windows icon loaded: $($icon.Width)x$($icon.Height)"
          } finally { $icon.Dispose() }

      - name: Package standard per-user setup with desktop shortcut
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $paths = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          $iscc = $paths | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw 'Inno Setup compiler not found' }
          Push-Location ops/gpt_windows_client
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0 -or !(Test-Path dist/GPT-Setup.exe)) {
            throw 'Inno Setup build failed'
          }
          Get-FileHash dist/GPT.exe -Algorithm SHA256 | Format-List
          Get-FileHash dist/GPT-Setup.exe -Algorithm SHA256 | Format-List
          Pop-Location

      - name: Require active Microsoft Defender and scan both binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $status = Get-MpComputerStatus -ErrorAction Stop
          Write-Host "Defender enabled=$($status.AntivirusEnabled), service=$($status.AMServiceEnabled), signatures=$($status.AntivirusSignatureVersion)"
          if (!$status.AntivirusEnabled -or !$status.AMServiceEnabled) {
            throw 'Defender unavailable on runner: no trusted scan result'
          }
          $files = @(
            (Resolve-Path ops/gpt_windows_client/dist/GPT.exe).Path,
            (Resolve-Path ops/gpt_windows_client/dist/GPT-Setup.exe).Path
          )
          $scanStart = Get-Date
          foreach ($file in $files) {
            Start-MpScan -ScanType CustomScan -ScanPath $file -ErrorAction Stop
            if (!(Test-Path $file)) { throw "Defender quarantined: $file" }
          }
          $threats = @(Get-MpThreatDetection -ErrorAction Stop | Where-Object {
            $_.InitialDetectionTime -ge $scanStart
          })
          if ($threats.Count -gt 0) { throw "Defender detected $($threats.Count) threats" }
          Write-Host 'Microsoft Defender custom scans complete with no detections.'

      - name: Test automatic update with active old GPT and isolated Chrome
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Resolve-Path ops/gpt_windows_client/dist/GPT-Setup.exe).Path
          $target = Join-Path $env:LOCALAPPDATA 'GPT\GPT.exe'
          $privateProfile = Join-Path $env:LOCALAPPDATA 'GPT\ChromeProfile'
          $ordinaryProfile = Join-Path $env:TEMP 'UnrelatedChromeProfile'
          # A complete, silent initial install.
          $p = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Initial setup exited $($p.ExitCode)" }
          $account = Join-Path $env:LOCALAPPDATA 'GPT\account.dat'
          $keep = 'fake-DPAPI-test-data-not-credentials'
          [System.IO.File]::WriteAllText($account,$keep)
          # Simulate an old GPT launcher which keeps its own EXE open.
          # The fake program is installed only on the isolated CI runner.
          $fake = Join-Path $env:TEMP 'gpt_old_process_hold.go'
          Set-Content $fake 'package main; import "time"; func main(){for {time.Sleep(time.Second)}}'
          go build -o $target $fake
          if ($LASTEXITCODE -ne 0) { throw 'Could not build old running GPT test process' }
          $ordinaryChromeExe = Join-Path $env:TEMP 'chrome.exe'
          Copy-Item $target $ordinaryChromeExe
          $old = $null
          $gptChrome = $null
          $ordinaryChrome = $null
          try {
            $old = Start-Process -FilePath $target -PassThru -WindowStyle Hidden
            $gptChrome = Start-Process -FilePath $ordinaryChromeExe -ArgumentList "--user-data-dir=$privateProfile" -PassThru -WindowStyle Hidden
            $ordinaryChrome = Start-Process -FilePath $ordinaryChromeExe -ArgumentList "--user-data-dir=$ordinaryProfile" -PassThru -WindowStyle Hidden
            Start-Sleep -Seconds 2
            if ($old.HasExited -or $gptChrome.HasExited -or $ordinaryChrome.HasExited) {
              throw 'Test processes exited before upgrade: invalid test'
            }
            # Overwrite must complete without any manual "Try again" dialog.
            $p = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -PassThru -Wait
            if ($p.ExitCode -ne 0) { throw "Upgrade with running GPT failed: $($p.ExitCode)" }
            Start-Sleep -Milliseconds 800
            $old.Refresh()
            $gptChrome.Refresh()
            $ordinaryChrome.Refresh()
            if (-not $old.HasExited) { throw 'Previous GPT.exe is still running' }
            if (-not $gptChrome.HasExited) { throw 'GPT-specific Chrome was not closed' }
            if ($ordinaryChrome.HasExited) { throw 'Unrelated Chrome was incorrectly closed' }
            if (!(Test-Path $target)) { throw 'New GPT.exe missing after upgrade' }
            if ([System.IO.File]::ReadAllText($account) -ne $keep) {
              throw 'Upgrade modified or deleted saved credentials'
            }
            Write-Host 'Upgrade completed; GPT and GPT Chrome closed; ordinary Chrome untouched; saved credentials intact.'
          } finally {
            foreach ($proc in @($old,$gptChrome,$ordinaryChrome)) {
              if ($null -ne $proc) {
                $proc.Refresh()
                if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
              }
            }
          }

      - name: Validate silent installation and standard uninstall on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Resolve-Path ops/gpt_windows_client/dist/GPT-Setup.exe).Path
          $p = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Setup exited $($p.ExitCode)" }
          $target = Join-Path $env:LOCALAPPDATA 'GPT\GPT.exe'
          $desktop = Join-Path ([Environment]::GetFolderPath('Desktop')) 'GPT.lnk'
          if (!(Test-Path $target)) { throw 'GPT.exe not installed' }
          if (!(Test-Path $desktop)) { throw 'GPT desktop shortcut missing' }
          $iconPath = Join-Path $env:LOCALAPPDATA 'GPT\GPT-v1.1.2.ico'
          if (!(Test-Path $iconPath)) { throw 'Approved GPT icon file missing' }
          $wsh = New-Object -ComObject WScript.Shell
          $shortcut = $wsh.CreateShortcut($desktop)
          if ($shortcut.IconLocation -notlike '*GPT-v1.1.2.ico*') { throw 'Shortcut missing approved GPT icon' }
          $uninstaller = Join-Path $env:LOCALAPPDATA 'GPT\unins000.exe'
          if (!(Test-Path $uninstaller)) { throw 'Uninstaller missing' }
          $p = Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Uninstall exited $($p.ExitCode)" }
          if (Test-Path $target) { throw 'GPT.exe remained after uninstall' }
          Write-Host 'Install/shortcut/uninstall checks passed.'

      - name: Publish production GPT Setup release after checks
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'gpt-windows-v1.1.3'
          $setup = 'ops/gpt_windows_client/dist/GPT-Setup.exe'
          if (!(Test-Path $setup)) { throw 'No verified installer to release' }
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          "$hash  GPT-Setup.exe" | Set-Content -Encoding ascii ops/gpt_windows_client/dist/SHA256SUMS.txt
          gh release create $tag $setup ops/gpt_windows_client/dist/SHA256SUMS.txt --title 'GPT Windows Setup v1.1.3' --notes 'Standard per-user Windows installer with custom GPT shortcut. Removed self-copy and hidden PowerShell. Scanned with Microsoft Defender and verified on Windows. Unsigned; Windows may show a publisher warning.'
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed' }

      - name: Save verified installer build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GPT-Setup-Verified-Unsigned
          path: |
            ops/gpt_windows_client/dist/GPT-Setup.exe
            ops/gpt_windows_client/dist/GPT.exe
          retention-days: 3
